[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning-zoo"
version = "0.1.0"
description = "A comprehensive machine learning library with modular components for building and training various ML models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Machine Learning Zoo Contributors" }]
maintainers = [{ name = "Machine Learning Zoo Contributors" }]
keywords = [
    "machine-learning",
    "deep-learning",
    "reinforcement-learning",
    "neural-networks",
    "pytorch",
    "transformers",
    "computer-vision",
    "nlp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=1.9.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.1.0",
    "tqdm>=4.62.0",
    "gymnasium>=0.26.0",
    "huggingface-hub>=0.23.0",
    "stable-baselines3>=2.8.0",
    "llama-cpp-python>=0.2.75",
    "transformers==5.5.3",
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.2",
    "pytorch-lightning>=2.1.0",
    "peft>=0.10.0",
    "deepspeed>=0.12.0",
    "jinja2>=3.1.0",
    "tensordict>=0.11.0",
    "dehb>=0.1.2",
    # Added from nglab's root pyproject.toml, which now points at this
    # submodule as its uv workspace member instead of declaring its own
    # dependency list. Packages already present above (torch, numpy, pandas,
    # hydra-core, tqdm, gymnasium, stable-baselines3, transformers,
    # pytorch-lightning, tensordict) kept their existing version constraints
    # here rather than being overwritten by nglab's.
    "loss-landscapes>=3.0.6",
    "matplotlib==3.7",
    "optuna>=4.6.0",
    "requests==2.31",
    "rich>=14.2.0",
    "scikit-learn>=1.3.0",
    "scipy==1.10",
    "tensorboard-logger==0.1",
    "torch-geometric>=2.7.0",
    "torchmetrics>=1.0",
    "torchrl>=0.10.1",
    "wandb==0.15",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "statsmodels>=0.14.0",
    "umap-learn>=0.5.4",
    "keyring>=24.2.0",
    "flask>=3.0.0",
    "psutil>=5.9.0",
    "mlflow>=2.7.0",
    "ray[default]>=2.7.0",
    "seaborn>=0.12.0",
    "deap>=1.4.1",
    "configspace>=0.7.1",
    "loguru>=0.7.2",
    "feedparser>=6.0.10",
    "redis>=5.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "asyncpg>=0.28.0",
    "boto3>=1.28.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-storage-control>=0.1.0",
    "distributed>=2026.1.1",
    "shap>=0.49.1",
    "pydantic>=2.0",
    "httpx>=0.28.1",
    "tensorboard>=2.20.0",
    "plotly>=6.5.2",
    "hvac>=2.4.0",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
# From nglab's root pyproject.toml.
cloud = ["boto3>=1.34.0", "google-cloud-storage>=2.14.0", "zstandard>=0.22.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=0.950",
    "flake8>=4.0.0",
    # From nglab's root dev dependency-group (maturin excluded — that
    # configures nglab's own Rust/pyo3 build, not this library).
    "hypothesis>=6.150.2",
    "ipykernel==6.25",
    "pip-audit>=2.10.0",
    "pyright>=1.1.408",
    "secretstorage>=3.5.0",
    "deptry>=0.12.0",
    "google>=3.0.0",
    "types-requests>=2.32.4.20260107",
    "jupyterlab>=4.5.2",
    "pre-commit>=2.17.0",
    "ruff>=0.15.0",
    "types-pyyaml>=6.0.12.20250915",
]
docs = ["sphinx>=4.3.0", "sphinx-rtd-theme>=1.0.0", "myst-parser>=0.17.0"]
gpu = ["torch>=1.9.0"]
all = [
    { include-group = "dev" },
    { include-group = "docs" },
    { include-group = "gpu" },
]

[project.scripts]
mlzoo = "main:main"

[project.urls]
Homepage = "https://github.com/yourusername/machine-learning-zoo"
Documentation = "https://machine-learning-zoo.readthedocs.io/"
Repository = "https://github.com/yourusername/machine-learning-zoo"
Issues = "https://github.com/yourusername/machine-learning-zoo/issues"
Changelog = "https://github.com/yourusername/machine-learning-zoo/blob/main/CHANGELOG.md"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]
exclude = ["notebooks", "examples", "tests", "scripts"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
known_first_party = ["machine_learning_zoo"]
known_third_party = [
    "torch",
    "numpy",
    "pandas",
    "omegaconf",
    "hydra",
    "tqdm",
    "gymnasium",
    "stable_baselines3",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "numpy.*",
    "pandas.*",
    "omegaconf.*",
    "hydra.*",
    "tqdm.*",
    "gymnasium.*",
    "stable_baselines3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU (deselect with '-m \"not gpu\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["machine_learning_zoo"]
omit = ["*/tests/*", "*/test_*.py", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
